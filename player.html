<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Camera</title>
  <!--
    Standalone HLS player. The map links here for `hls` feeds instead of the raw
    .m3u8, because Chrome/Firefox can't play a bare HLS playlist in a tab (only
    Safari can). hls.js decodes it here, so the "Open live stream" link works in
    every browser. Usage: player.html?src=<m3u8 url>&title=<name>
  -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { padding: 11px 16px; font-size: 0.95rem; font-weight: 600;
      display: flex; align-items: center; gap: 9px; }
    .live { width: 8px; height: 8px; border-radius: 50%; background: #ef4444;
      animation: pulse 1.4s ease-in-out infinite; flex-shrink: 0; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .wrap { flex: 1; position: relative; background: #000; }
    video { position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; background: #000; }
    .msg { position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; color: #94a3b8; padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <header><span class="live"></span><span id="title">Live Camera</span></header>
  <div class="wrap">
    <video id="video" controls autoplay muted playsinline></video>
    <div class="msg" id="msg">Loading live video…</div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const src = params.get("src") || "";
    const title = params.get("title") || "Live Camera";
    document.getElementById("title").textContent = title;
    document.title = title;

    const video = document.getElementById("video");
    const msg = document.getElementById("msg");
    const hide = () => { msg.style.display = "none"; };
    const fail = (text) => { msg.textContent = text; msg.style.display = "flex"; };

    // Only play https .m3u8 URLs so the page can't be pointed at arbitrary content.
    let valid = false;
    try {
      const u = new URL(src);
      valid = u.protocol === "https:" && /\.m3u8(\?|$)/i.test(u.pathname + u.search);
    } catch (e) { /* invalid URL */ }

    if (!valid) {
      fail("No valid stream URL.");
    } else if (window.Hls && window.Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(src);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { hide(); video.play().catch(() => {}); });
      hls.on(Hls.Events.ERROR, (_evt, data) => { if (data && data.fatal) fail("Stream unavailable."); });
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = src;
      video.addEventListener("loadedmetadata", () => { hide(); video.play().catch(() => {}); });
      video.addEventListener("error", () => fail("Stream unavailable."));
    } else {
      fail("Live video is not supported in this browser.");
    }
  </script>
</body>
</html>
